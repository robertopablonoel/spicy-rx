<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .swatch { flex: 1; height: 140px; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; }
  .swatch .name { color: inherit; text-transform: uppercase; font-weight: 500; }
  .swatch .hex { color: inherit; opacity: 0.55; margin-top: 2px; }
</style>
</head>
<body class="card">
  <div class="row" style="gap: 4px; align-items: stretch;">
    <div class="swatch" style="background: #0A0907; color: var(--mist); border: 1px solid var(--ash);">
      <div class="name">Void</div><div class="hex">#0A0907</div>
    </div>
    <div class="swatch" style="background: #14110D; color: var(--mist);">
      <div class="name">Cosmos</div><div class="hex">#14110D</div>
    </div>
    <div class="swatch" style="background: #1F1A14; color: var(--mist);">
      <div class="name">Crater</div><div class="hex">#1F1A14</div>
    </div>
    <div class="swatch" style="background: #2A2520; color: var(--fog);">
      <div class="name">Ash</div><div class="hex">#2A2520</div>
    </div>
    <div class="swatch" style="background: #4A443D; color: var(--mist);">
      <div class="name">Smoke</div><div class="hex">#4A443D</div>
    </div>
    <div class="swatch" style="background: #8A8278; color: var(--cosmos);">
      <div class="name">Fog</div><div class="hex">#8A8278</div>
    </div>
    <div class="swatch" style="background: #BFB7AB; color: var(--cosmos);">
      <div class="name">Mist</div><div class="hex">#BFB7AB</div>
    </div>
    <div class="swatch" style="background: #F2ECDF; color: var(--cosmos);">
      <div class="name">Paper</div><div class="hex">#F2ECDF</div>
    </div>
    <div class="swatch" style="background: #FAF6EE; color: var(--cosmos);">
      <div class="name">Bone</div><div class="hex">#FAF6EE</div>
    </div>
  </div>
</body></html>
