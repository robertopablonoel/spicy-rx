<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body class="card">
  <div class="col" style="gap: 16px;">
    <div class="row" style="justify-content: space-between; align-items: baseline;">
      <div style="font-family: var(--font-mono); font-weight: 500; font-size: 56px; letter-spacing: 0.02em; line-height: 1;">Aa</div>
      <div class="col" style="align-items: flex-end; gap: 2px;">
        <div class="lbl">Mono / Readout</div>
        <div class="val">JetBrains Mono · 400 / 500</div>
      </div>
    </div>
    <div class="row" style="gap: 12px;">
      <span style="font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ember); padding: 4px 8px; border: 1px solid var(--border-hot); border-radius: 999px;">SCHEDULE IV</span>
      <span style="font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ember); padding: 4px 8px; border: 1px solid var(--border-hot); border-radius: 999px;">Rx ONLY</span>
      <span style="font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--vitals); padding: 4px 8px; border: 1px solid rgba(56,255,161,0.3); border-radius: 999px;">SYSTEM OK</span>
      <span style="font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fog); padding: 4px 8px; border: 1px solid var(--border); border-radius: 999px;">LOT 0042</span>
    </div>
    <div style="font-family: var(--font-mono); font-size: 13px; color: var(--mist);">
      <span style="color: var(--vitals);">●</span>&nbsp; CALIBRATING · 02s remaining · 200 mg/ml · pH 4.2 · ≥99.4% purity
    </div>
  </div>
</body></html>
