<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .btns { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  button {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0;
    padding: 12px 22px;
    border-radius: 0;
    border: 0;
    cursor: pointer;
    transition: all 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .btn-primary { background: var(--hot); color: var(--void); }
  .btn-primary:hover { box-shadow: 0 0 0 1px rgba(255,59,31,0.4), 0 0 32px rgba(255,59,31,0.45); }
  .btn-secondary { background: transparent; color: var(--fg); border: 1px solid var(--ash); }
  .btn-secondary:hover { border-color: var(--mist); }
  .btn-ghost { background: transparent; color: var(--fg); padding: 12px 8px; }
  .btn-ghost:hover { color: var(--ember); }
  .btn-danger { background: transparent; color: var(--hot); border: 1px solid var(--border-hot); }
  .btn-pill { background: var(--vitals); color: var(--void); border-radius: 999px; padding: 10px 18px; }
  .btn-sm { padding: 8px 14px; font-size: 12px; }
</style>
</head>
<body class="card">
  <div class="btns">
    <button class="btn-primary">Start consultation →</button>
    <button class="btn-secondary">How it works</button>
    <button class="btn-ghost">Learn more</button>
    <button class="btn-danger">Cancel order</button>
    <button class="btn-pill">Vitals OK</button>
    <button class="btn-primary btn-sm">Continue</button>
  </div>
  <div class="val" style="margin-top: 16px;">Primary uses --hot. Hover grows heat glow — never changes hue. Press scales to 0.98 (120ms).</div>
</body></html>
