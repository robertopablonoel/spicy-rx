<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .swatch { flex: 1; height: 180px; display: flex; flex-direction: column; justify-content: flex-end; padding: 14px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; }
  .swatch .name { text-transform: uppercase; font-weight: 600; }
  .swatch .hex { opacity: 0.7; margin-top: 2px; font-size: 10px; }
  .swatch .role { font-family: var(--font-body); font-size: 11px; text-transform: none; letter-spacing: 0; opacity: 0.65; margin-top: 6px; font-weight: 500;}
</style>
</head>
<body class="card">
  <div class="row" style="gap: 4px; align-items: stretch;">
    <div class="swatch" style="background: #FF3B1F; color: var(--void);">
      <div class="name">Hot</div><div class="hex">#FF3B1F</div>
      <div class="role">Primary CTA, brand mark</div>
    </div>
    <div class="swatch" style="background: #C5240D; color: var(--bone);">
      <div class="name">Hot Deep</div><div class="hex">#C5240D</div>
      <div class="role">Pressed / on light bg</div>
    </div>
    <div class="swatch" style="background: #FF7A1A; color: var(--void);">
      <div class="name">Ember</div><div class="hex">#FF7A1A</div>
      <div class="role">Secondary heat, eyebrows</div>
    </div>
    <div class="swatch" style="background: #F5D547; color: var(--void);">
      <div class="name">Serum</div><div class="hex">#F5D547</div>
      <div class="role">Lab yellow, warnings</div>
    </div>
  </div>
</body></html>
