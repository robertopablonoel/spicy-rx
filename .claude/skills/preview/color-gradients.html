<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .swatch { flex: 1; height: 140px; display: flex; flex-direction: column; justify-content: space-between; padding: 14px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; border-radius: 0; }
  .swatch .name { text-transform: uppercase; font-weight: 600; }
  .swatch .v { font-family: var(--font-body); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.8;}
</style>
</head>
<body class="card">
  <div class="row" style="gap: 4px; align-items: stretch;">
    <div class="swatch" style="background: var(--grad-capsaicin); color: var(--void);">
      <div class="v">Brand</div><div class="name">Capsaicin</div>
    </div>
    <div class="swatch" style="background: var(--grad-plasma); color: var(--bone);">
      <div class="v">Pop</div><div class="name">Plasma</div>
    </div>
    <div class="swatch" style="background: var(--grad-vacuum); color: var(--mist); border: 1px solid var(--ash);">
      <div class="v">Hero</div><div class="name">Vacuum</div>
    </div>
    <div class="swatch" style="background: var(--grad-aurora); color: var(--void);">
      <div class="v">Section</div><div class="name">Aurora</div>
    </div>
  </div>
  <div class="val" style="margin-top: 12px;">Capsaicin = the signature brand gradient. One per page, max.</div>
</body></html>
