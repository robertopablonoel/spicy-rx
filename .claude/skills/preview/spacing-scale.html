<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .scale { display: flex; align-items: flex-end; gap: 14px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--hot); }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--mist); }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--fog); }
</style>
</head>
<body class="card">
  <div class="scale">
    <div class="step"><div class="bar" style="width:4px;height:4px"></div><div class="tok">sp-1</div><div class="px">4</div></div>
    <div class="step"><div class="bar" style="width:8px;height:8px"></div><div class="tok">sp-2</div><div class="px">8</div></div>
    <div class="step"><div class="bar" style="width:12px;height:12px"></div><div class="tok">sp-3</div><div class="px">12</div></div>
    <div class="step"><div class="bar" style="width:16px;height:16px"></div><div class="tok">sp-4</div><div class="px">16</div></div>
    <div class="step"><div class="bar" style="width:24px;height:24px"></div><div class="tok">sp-5</div><div class="px">24</div></div>
    <div class="step"><div class="bar" style="width:32px;height:32px"></div><div class="tok">sp-6</div><div class="px">32</div></div>
    <div class="step"><div class="bar" style="width:48px;height:48px"></div><div class="tok">sp-7</div><div class="px">48</div></div>
    <div class="step"><div class="bar" style="width:64px;height:64px"></div><div class="tok">sp-8</div><div class="px">64</div></div>
    <div class="step"><div class="bar" style="width:96px;height:96px"></div><div class="tok">sp-9</div><div class="px">96</div></div>
  </div>
  <div class="val" style="margin-top: 18px;">4px base. Tight (4/8/12/16) inside components — loose (32/48/64/96) between sections. Skip 20/24/28.</div>
</body></html>
