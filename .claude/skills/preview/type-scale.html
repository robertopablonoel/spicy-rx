<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body class="card">
  <div class="col" style="gap: 10px;">
    <div class="row" style="gap: 24px; align-items: baseline; flex-wrap: wrap;">
      <div style="font-family: var(--font-display); font-size: 88px; font-weight: 700; letter-spacing: -0.04em; line-height: 0.95;">88</div>
      <div style="font-family: var(--font-display); font-size: 64px; font-weight: 700; letter-spacing: -0.04em; line-height: 1;">64</div>
      <div style="font-family: var(--font-display); font-size: 46px; font-weight: 600; letter-spacing: -0.03em; line-height: 1;">46</div>
      <div style="font-family: var(--font-display); font-size: 34px; font-weight: 600; letter-spacing: -0.02em; line-height: 1;">34</div>
      <div style="font-family: var(--font-body); font-size: 26px; font-weight: 600; line-height: 1;">26</div>
      <div style="font-family: var(--font-body); font-size: 21px; font-weight: 500; line-height: 1;">21</div>
      <div style="font-family: var(--font-body); font-size: 18px; font-weight: 500; line-height: 1;">18</div>
      <div style="font-family: var(--font-body); font-size: 16px; line-height: 1;">16</div>
      <div style="font-family: var(--font-body); font-size: 14px; color: var(--mist); line-height: 1;">14</div>
      <div style="font-family: var(--font-mono); font-size: 12px; color: var(--fog); letter-spacing: 0.04em;">12</div>
    </div>
    <div class="row" style="gap: 12px; justify-content: space-between; margin-top: 8px;">
      <div class="lbl">Type scale · modular ≈ 1.25</div>
      <div class="val">12 · 14 · 16 · 18 · 21 · 26 · 34 · 46 · 64 · 88 · 124</div>
    </div>
  </div>
</body></html>
