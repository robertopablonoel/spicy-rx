<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .swatch { flex: 1; height: 180px; display: flex; flex-direction: column; justify-content: flex-end; padding: 14px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; }
  .swatch .name { text-transform: uppercase; font-weight: 600; }
  .swatch .hex { opacity: 0.7; margin-top: 2px; font-size: 10px; }
  .swatch .role { font-family: var(--font-body); font-size: 11px; text-transform: none; letter-spacing: 0; opacity: 0.65; margin-top: 6px; font-weight: 500;}
</style>
</head>
<body class="card">
  <div class="row" style="gap: 4px; align-items: stretch;">
    <div class="swatch" style="background: #38FFA1; color: var(--void);">
      <div class="name">Vitals</div><div class="hex">#38FFA1</div>
      <div class="role">System ok, success</div>
    </div>
    <div class="swatch" style="background: #FF2E8A; color: var(--void);">
      <div class="name">Plasma</div><div class="hex">#FF2E8A</div>
      <div class="role">Specimen pop, irreverent</div>
    </div>
    <div class="swatch" style="background: #2A4FFF; color: var(--bone);">
      <div class="name">Cobalt</div><div class="hex">#2A4FFF</div>
      <div class="role">Alien beacon, info</div>
    </div>
    <div class="swatch" style="background: #8A4DFF; color: var(--bone);">
      <div class="name">Ultraviolet</div><div class="hex">#8A4DFF</div>
      <div class="role">Deep-space gradients</div>
    </div>
  </div>
</body></html>
